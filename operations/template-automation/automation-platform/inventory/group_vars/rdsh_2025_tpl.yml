# inventory/group_vars/rdsh_2025_tpl.yml
# Add this file to your existing ~/golden-images/inventory/group_vars/
# alongside all.yml and ubt_2404_tpl.yml - same "each image gets its own
# group_vars file" convention. Nothing here is secret; vault_win_admin_password
# and vault_horizon_api_password stay in inventory/group_vars/all/vault.yml.
#
# You need ONE new vault entry for this image that ubt_2404_tpl doesn't have:
#   ansible-vault edit inventory/group_vars/all/vault.yml
#   # add: vault_win_admin_password: "<strong password>"
# This is the plaintext Windows local Administrator / build / WinRM password -
# see variables.pkr.hcl's build_password comment for why Windows needs this
# as plaintext rather than the pre-hashed value ubt_2404_tpl's
# vault_local_admin_password becomes.

# ---- Placement ----
# PLACEHOLDER VALUES ONLY, on purpose - this repo is public. Extended
# 2026-09-17, per the user's explicit request, to cover every site-specific
# value in this file the same way the "Guest network" section below already
# handled guest_ip_cidr/guest_gateway/guest_dns_servers - not just network
# fields. Real values belong in rdsh_2025_tpl.local.yml on each control
# node; see the "Guest network" section below for the full mechanism, and
# rdsh_2025_tpl.local.yml.example (same directory) for every overridable
# key documented in one place.
vcenter_cluster: "CHANGEME-cluster"         # <- placeholder - real value goes in rdsh_2025_tpl.local.yml
vcenter_datastore: "CHANGEME-datastore"     # <- placeholder - real value goes in rdsh_2025_tpl.local.yml
vcenter_folder: "CHANGEME-folder"           # <- placeholder - real value goes in rdsh_2025_tpl.local.yml
vcenter_network: "CHANGEME-portgroup"       # <- placeholder - real value goes in rdsh_2025_tpl.local.yml

# ---- Sizing ----
# RDSH hosts serve multiple concurrent sessions - sized well above
# ubt_2404_tpl's single-user VDI defaults, per the source guide's own
# Windows Server RDSH sizing (4 vCPU / 2 cores-per-socket / 16GB / 80GB).
vm_cpu_count: 4
vm_cores_per_socket: 2
vm_mem_size_mb: 16384
vm_disk_size_mb: 81920

# ---- Guest OS type ----
# VERIFIED against this vCenter (GPU-02 cluster) via OVF export of a
# throwaway VM - see variables.pkr.hcl's vm_guest_os_type comment. The
# "Microsoft Windows Server 2025 (64-bit)" picker entry maps to guestId
# windows2022srvNext_64Guest here, not windows2025srvNext_64Guest.
vm_guest_os_type: "windows2022srvNext_64Guest"
vm_version: 20                                    # hardware version 20+ needed for a native Server 2025 guest profile

# ---- Install media ----
# iso_paths[0]: the Windows Server 2025 install ISO, already staged on a
# vSphere-visible datastore - Packer's vsphere-iso builder mounts iso_paths
# entries directly via the vCenter API (datastore or content library
# syntax), it can't reach an arbitrary NFS path the way Ansible's win_copy
# can. iso_paths[1]: the ESXi-provided VMware Tools ISO - "[]" (empty
# datastore name) resolves against whichever datastore the host itself
# already serves /vmimages/tools-isoimages/windows.iso from; you should not
# need to change that second path.
iso_paths:
  - "[CHANGEME-datastore] ISO/CHANGEME-windows-server-2025-install.iso"   # <- placeholder - real value goes in rdsh_2025_tpl.local.yml
  - "[] /vmimages/tools-isoimages/windows.iso"

# ---- Guest network ----
# Same "reserve ahead of time" convention as ubt_2404_tpl - see that image's
# own group_vars comment. Windows NetBIOS names cap at 15 characters.
#
# NOTE: guest_ip_cidr/guest_gateway/guest_dns_servers below are
# documentation of the reservation only - nothing in this build's
# autounattend answer file or playbook.yml actually applies a static IP
# inside the guest (see variables.pkr.hcl's comment on those three). This
# only gets the guest .170 in practice if your DHCP server has a
# reservation binding that address to mac_address below; otherwise the
# guest will DHCP to whatever address the server hands out.
#
# PLACEHOLDER VALUES ONLY, on purpose - this repo is public. The three
# values below are RFC 5737 TEST-NET-2 (198.51.100.0/24), reserved for
# documentation and never a real, routable network - not your actual
# reservation. (They briefly WERE real internal values here for real,
# which is exactly the mistake this setup now guards against - see
# below.)
#
# Real values belong in inventory/group_vars/rdsh_2025_tpl.local.yml on
# each control node instead - copy rdsh_2025_tpl.local.yml.example (same
# directory) to that filename and fill it in there. That file is
# .gitignore'd and never committed; scripts/build.sh and
# scripts/publish_to_pool.sh both load it automatically when present and
# its values override these placeholders (see either script's own "Local,
# untracked overrides" comment). Only override what you actually need to
# change - anything left out of the local file falls through to the
# placeholders here.
guest_hostname: rdsh-2025-tpl
guest_ip_cidr: "198.51.100.170/24"    # <- placeholder (TEST-NET-2) - real value goes in rdsh_2025_tpl.local.yml
guest_gateway: "198.51.100.1"         # <- placeholder (TEST-NET-2) - real value goes in rdsh_2025_tpl.local.yml
guest_dns_servers:                    # <- placeholders (TEST-NET-2) - real values go in rdsh_2025_tpl.local.yml
  - "198.51.100.11"
  - "198.51.100.20"

# ---- MAC address ----
# This IS actually consumed (rdsh_2025_tpl.pkr.hcl's network_adapters.mac_address)
# - pin one if this network needs a DHCP reservation or MAC allowlisting;
# leave "" for auto-assignment. Must be in vSphere's manually-assignable
# VMware OUI range (00:50:56:00:00:00-00:50:56:3F:FF:FF) and unique on this
# vCenter. PLACEHOLDER ("" = auto-assign) on purpose - a pinned MAC paired
# with the real guest_ip_cidr reservation above would together identify a
# real host on a real network; real value goes in rdsh_2025_tpl.local.yml.
mac_address: ""     # <- placeholder (auto-assign) - real value goes in rdsh_2025_tpl.local.yml if you need a DHCP reservation/MAC allowlisting

# ---- Windows build ----
timezone: "W. Europe Standard Time"   # Windows tz display name, not IANA - see variables.pkr.hcl's comment
win_language: "en-US"
win_keyboard: "0414:00000414"          # Norwegian layout; "0409:00000409" for US layout
win_image_name: "Windows Server 2025 Datacenter (Desktop Experience)"   # <- must match install.wim exactly, see variables.pkr.hcl comment
win_kms_key: "D764K-2NDRG-47T6Q-P8T8W-YP6DF"   # Server 2025 Datacenter GVLK (generic volume-license placeholder, not a real key)
win_full_name: "Administrator"
win_org_name: "Contoso"

# ---- WinRM ----
winrm_port: 5985

# ---- Build logging ----
# Every installer role below appends an /log (MSI) or equivalent argument
# pointing here when this is true - one place to find every component's
# install log if a build fails partway through.
build_log_enabled: true
build_log_dir: 'C:\ProgramData\Omnissa\Logs'

# ---- Verification toggles ----
# Added 2026-09-11 so a build can skip specific slow/flaky stages for a
# quick pipeline-shape verification run, without hand-editing playbook.yml
# each time - set false here (or pass -e enable_windows_update=false on the
# packer/ansible command line) instead.
#
# enable_windows_update: true by default. Set false to verify the rest of
# the pipeline (dotnet35 / OSOT Optimize-Generalize-Finalize / store app
# cleanup / reordering) without sitting through the full looped Windows
# Update pass - it's slow even when clean, and has a history of getting
# stuck on KB5122871 (see roles/windows_update's own header). Known
# consequence of turning it off: rds_role_install may hit the same
# "Error: 0x800f0922" DISM failure that having Windows Update in the
# pipeline was specifically added to fix (see that role's own header for
# the real build failure this traces back to) - so a run with this off is
# fine for verifying everything UP TO rds_role_install, but don't treat a
# build made with this off as representative, and re-enable it before
# actually publishing anything built with it off.
enable_windows_update: true

# osot_generalize_manual_pause: DISABLED 2026-09-16 per the user's explicit
# request, following this same toggle pattern rather than deleting the
# pause's code outright - see roles/osot_generalize/tasks/main.yml's own
# header for why: unlike osot_optimize's earlier pause (fully removed once
# it was no longer needed), this one is worth being able to bring back for
# a future build where a manual look before Generalize is wanted again (a
# new answer file, an OSOT version bump, anything else worth checking
# before Generalize commits and exits Audit Mode for good). Set true here
# (or pass -e osot_generalize_manual_pause=true) to re-enable it.
osot_generalize_manual_pause: false

# ---- Horizon Agent (RDSH mode) ----
# ADDLOCAL feature toggles - playbook.yml's horizon_agent role builds the
# ADDLOCAL string from these. Defaults below mirror the source guide's own
# RDSH-tuned choices (NGVC on for instant-clone RDSH, PrintRedir/PSG on as
# RDSH-relevant, RDP/RDSH3D off unless you have vGPU-backed 3D RDSH).
horizon_agent_installer: "/mnt/wdnfs/Ansible/horizon/CHANGEME-horizon-agent-installer.exe"   # <- placeholder - real value (on your NFS share's horizon/ folder) goes in rdsh_2025_tpl.local.yml
horizon_vc_managed: true
horizon_core: true
horizon_blast: true
horizon_usb: true
horizon_ngvc: true              # required for instant-clone RDSH
horizon_rtav: true
horizon_cdr: true
horizon_serial_port: false
horizon_scanner: false
horizon_geolocation: false
horizon_smartcard: true
horizon_audio: true
horizon_mmr: true
horizon_rdp: false
horizon_rdsh3d: false           # enable with vGPU for 3D RDSH
horizon_sdo_sensor: false
horizon_perf_tracker: true
horizon_help_desk: true
horizon_print_redir: false       # important for RDSH - session-scoped printer redirection
horizon_psg: true
horizon_url_filtering: false

# ---- DEM Agent ----
dem_agent_installer: "/mnt/wdnfs/Ansible/dem/CHANGEME-dem-agent-installer.msi"   # <- placeholder - real value (on your NFS share's dem/ folder) goes in rdsh_2025_tpl.local.yml
dem_flex_engine: true
dem_flex_migrate: false
dem_self_support: true
dem_mgmt_console: false
dem_integration_enabled: false
dem_noad_config: ""
dem_comp_env_config: ""

# ---- App Volumes Agent ----
appvolumes_agent_installer: "/mnt/wdnfs/Ansible/appvolumes/CHANGEME-appvolumes-agent-installer.msi"   # <- placeholder - real value (on your NFS share's appvolumes/ folder) goes in rdsh_2025_tpl.local.yml
appvolumes_manager: "appvol.example.com"   # already safe - generic placeholder hostname
appvolumes_port: 443
appvolumes_ssl_validation: 1

# ---- OS Optimization Tool (OSOT) ----
# Added 2026-09-11 per the user's explicit request to restructure this
# pipeline around Omnissa's own "Using Automation to Create Optimized
# Windows Images for Horizon VMs" / "Manually creating optimized Windows
# images for Horizon VMs" guides - see roles/osot_optimize, osot_generalize,
# osot_finalize, and playbook.yml's own rewritten header comment (OSOT used
# to be flagged there as "a known, previously-unresolved blocker on this
# exact platform" - driving it via its documented CLI instead of the GUI
# that actually hung under WinRM is what resolves that, not a blind retry).
#
# osot_installer: PLACEHOLDER - point this at wherever you stage the OSOT
# executable on your NFS share, same convention as horizon_agent_installer/
# dem_agent_installer/appvolumes_agent_installer above (an absolute path on
# the control node's NFS mount). CONFIRMED 2026-09-11 from a real build's
# error output (osot_optimize's win_copy failing to find the old placeholder
# on the control node) plus a directory listing of the NFS share's osot/
# folder - /export/ansible/Ansible/osot/ is the NFS export path shown by
# that share browser, not the control node's own mount path; following the
# same /mnt/wdnfs/Ansible/<component>/<file> convention every other
# installer var above already uses for that same share.
osot_installer: "/mnt/wdnfs/Ansible/osot/CHANGEME-osot-installer.exe"   # <- placeholder - real value goes in rdsh_2025_tpl.local.yml

# osot_template: NOT currently passed to -t (see roles/osot_optimize's own
# header) - a real build failed to load exactly this string
# ("File not found: Omnissa\Windows 10, 11 and Server 2022, 2025.xml"),
# even though it's the one entry shown in the OSOT GUI's Optimize tab
# template dropdown (confirmed 2026-09-10 on an existing reference VM,
# CS-SRV-01, where OSOT had already been run before - this build VM runs
# OSOT for the first time, and whatever populates that named template file
# on disk may not have happened yet there). osot_optimize now omits -t and
# relies on the documented default-template fallback instead. Left defined
# here, unused, in case -t needs revisiting once you've confirmed what
# OSOT's own template repository actually looks like on a freshly-imaged
# build VM (vs. this pre-existing reference one).
osot_template: "Omnissa\\Windows 10, 11 and Server 2022, 2025"

# osot_finalize_job_numbers / osot_finalize_cleanup_job_numbers: originally
# ONE variable ("0 1 2 3 4 5 6 7 10 11"), set 2026-09-11 per the user's
# explicit choice to run every Finalize job except 8 and 9. SPLIT INTO TWO
# 2026-09-16, per the user's explicit request to run OSOT Finalize as two
# separate passes at two different points in the pipeline - see
# roles/osot_finalize_cleanup's own header for the full rationale (job 7's
# SDelete64.exe can run long, so App Volumes now waits for it to genuinely
# finish before installing) and roles/osot_finalize's own header for why job
# 9 changed. Job 8 stays excluded from both, unchanged:
#   8 "Creates local group policies" (needs LGPO.exe) - not wanted, skipped
#     on purpose, not staged.
#
# FIRST pass (roles/osot_finalize_cleanup): the disk/profile/log
# housekeeping jobs. Originally ran BEFORE appvolumes so App Volumes
# wouldn't start until job 7 (SDelete64.exe) genuinely finished - MOVED
# 2026-09-17, per the user's explicit request, to run AFTER appvolumes
# instead (see roles/osot_finalize_cleanup's own header for the full
# before/after reasoning). Still runs before the second pass below.
osot_finalize_cleanup_job_numbers: "0 1 2 3 4 5 6 7"

# SECOND pass (roles/osot_finalize, right before hardening/cleanup/
# shutdown): the network/licensing-identity reset jobs. Runs after both
# appvolumes and osot_finalize_cleanup, unaffected by the 2026-09-17
# reorder above.
# Job 9 "Clears KMS Settings" is NOW INCLUDED - FLAGGED, not a silent
# change: the original 2026-09-11 comment on this variable excluded job 9
# because "this image uses win_kms_key's GVLK... clearing KMS settings here
# isn't something the user wants done at Finalize time" (still true - see
# variables.pkr.hcl). The user's 2026-09-16 request explicitly listed
# "9,10 and 11" for this pass, which reverses that - implemented as asked;
# see roles/osot_finalize's own header for the full flag/confirmation note.
#
# Job 11 "Release IP Address" - REMOVED 2026-09-16, same day it was added,
# after a real build (still running the pre-split single-pass version, but
# with the same "0 1 2 3 4 5 6 7 10 11" list) failed exactly where job 11
# would have run, with a WinRM ConnectTimeoutError to the guest ("Max
# retries exceeded... Connection to <ip> timed out (connect timeout=30)").
# Cross-checked against Omnissa's own docs.omnissa.com Finalize command-line
# reference: job 11 is literally "Releases IP Address" - no further detail
# on mechanism, but the failure signature (a fresh TCP connect timing out,
# not an existing connection resetting) matches the guest's IP actually
# changing/dropping mid-command. Confirmed with the user this is a real
# risk beyond just this one Ansible task: rdsh_2025_tpl.pkr.hcl's own
# communicator = "winrm" means Packer's shutdown_command rides the same
# channel, so losing the IP here could just as easily break Packer's own
# graceful shutdown afterward. User's explicit choice, given that risk:
# drop job 11 from the automated pipeline entirely rather than risk another
# failed build cycle chasing a Packer/WinRM interaction that isn't
# documented anywhere. If you want the "release IP before capture" hygiene
# back later, it needs its own dedicated, carefully-observed test run - not
# bundled in here.
osot_finalize_job_numbers: "9 10"

# osot_finalize_sdelete64_installer: CONFIRMED 2026-09-11 from the same NFS
# directory listing that confirmed osot_installer above - sdelete64.exe
# (NOT sdelete.exe, the 32-bit build sitting next to it in the same
# folder - job 7 needs the 64-bit one per the PDF) lives alongside the OSOT
# exe itself. Only used by roles/osot_finalize_cleanup now (job 7 moved
# there in the 2026-09-16 split above).
osot_finalize_sdelete64_installer: "/mnt/wdnfs/Ansible/osot/CHANGEME-sdelete64-installer.exe"   # <- placeholder - real value goes in rdsh_2025_tpl.local.yml

# ---- RDSH login group ----
# Added to the local Remote Desktop Users group by roles/hardening - see
# that role's header comment for why RD licensing mode itself is NOT set
# here. Matches ubt_2404_tpl's linux_login_group in spirit.
rdsh_login_group: "CHANGEME-ad-group"   # <- placeholder - real AD group name goes in rdsh_2025_tpl.local.yml

# ---- Optional extra apps (roles/apps) ----
# Empty by default - see that role's header comment for the format. Each
# entry's installer path is an absolute path on the control node's NFS
# mount (e.g. "/mnt/wdnfs/Ansible/apps/<file>"), not relative to this image
# directory - same convention as horizon_agent_installer/dem_agent_installer/
# appvolumes_agent_installer above. No specific app is baked in; add entries
# here once you have a verified silent-install command line for whatever you
# want on this image.
apps_to_install: []

# ---- Horizon farm/pool publish (scripts/publish_to_pool.sh) ----
# Fixed 2026-09-10: publish_to_pool.sh used to be hardcoded to
# ubt_2404_tpl's image dir/group_vars and only knew the desktop-pool REST
# workflow - a real run against an rdsh_2025_tpl build silently resolved
# ubt_2404_tpl's vars and almost pushed onto HZUBTP1_ref (caught by that
# script's own confirmation prompt, nothing was pushed). publish_to_pool.sh
# is now parameterized by image_key and reads horizon_farm_name (this
# image) vs. horizon_pool_name (ubt_2404_tpl) to pick the right REST
# workflow - see that script's own "Pool vs farm" header comment for the
# farm-specific endpoints and how confident to be in them (the farm path
# is new and, unlike the pool path, has not yet been run for real).
horizon_connection_server: "cs-srv-01.example.com"   # already safe - generic placeholder hostname
horizon_farm_name: "CHANGEME-farm-name"   # <- placeholder - real value goes in rdsh_2025_tpl.local.yml (NOT horizon_pool_name - RDSH publishes to a Farm)
horizon_api_username: "CHANGEME-api-username"   # <- placeholder - real value goes in rdsh_2025_tpl.local.yml
horizon_api_domain: "example.com"   # already safe - generic placeholder domain
# vault_horizon_api_password goes in inventory/group_vars/all/vault.yml,
# same entry ubt_2404_tpl.yml already uses (shared, not per-image).
