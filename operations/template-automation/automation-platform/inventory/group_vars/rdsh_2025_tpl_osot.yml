# inventory/group_vars/rdsh_2025_tpl_osot.yml
# Non-secret OS Optimization Tool (OSOT) job-selection settings for
# rdsh_2025_tpl - split out of rdsh_2025_tpl.yml on 2026-09-18, per the
# user's explicit request, purely to keep that file to VM-shape/build
# settings. Nothing here is more or less public than what was already
# committed in rdsh_2025_tpl.yml.
#
# scripts/build.sh and scripts/publish_to_pool.sh load this file
# automatically (right after rdsh_2025_tpl.yml, before rdsh_2025_tpl.local.yml)
# if it exists - nothing else to wire up. osot_installer and
# osot_finalize_sdelete64_installer below are PLACEHOLDERS, same convention
# rdsh_2025_tpl.yml used before this split - real values go in
# rdsh_2025_tpl.local.yml (this repo is public).
#
# Added 2026-09-11 per the user's explicit request to restructure the
# pipeline around Omnissa's own "Using Automation to Create Optimized
# Windows Images for Horizon VMs" / "Manually creating optimized Windows
# images for Horizon VMs" guides - see roles/osot_optimize, osot_generalize,
# osot_finalize, and playbook.yml's own header comment (OSOT used to be
# flagged there as "a known, previously-unresolved blocker on this exact
# platform" - driving it via its documented CLI instead of the GUI that
# actually hung under WinRM is what resolves that, not a blind retry).

# osot_installer: PLACEHOLDER - point this at wherever you stage the OSOT
# executable on your NFS share, same convention as the agent installer
# paths in rdsh_2025_tpl_agents.yml (an absolute path on the control node's
# NFS mount). CONFIRMED 2026-09-11 from a real build's error output
# (osot_optimize's win_copy failing to find the old placeholder on the
# control node) plus a directory listing of the NFS share's osot/ folder -
# /export/ansible/Ansible/osot/ is the NFS export path shown by that share
# browser, not the control node's own mount path; following the same
# /mnt/wdnfs/Ansible/<component>/<file> convention every other installer
# var already uses for that same share.
osot_installer: "/mnt/wdnfs/Ansible/osot/CHANGEME-osot-installer.exe"   # <- placeholder - real value goes in rdsh_2025_tpl.local.yml

# osot_template: NOT currently passed to -t (see roles/osot_optimize's own
# header) - a real build failed to load exactly this string
# ("File not found: Omnissa\Windows 10, 11 and Server 2022, 2025.xml"),
# even though it's the one entry shown in the OSOT GUI's Optimize tab
# template dropdown (confirmed 2026-09-10 on an existing reference VM,
# CS-SRV-01, where OSOT had already been run before - this build VM runs
# OSOT for the first time, and whatever populates that named template file
# on disk may not have happened yet there). osot_optimize now omits -t and
# relies on the documented default-template fallback instead. Left defined
# here, unused, in case -t needs revisiting once you've confirmed what
# OSOT's own template repository actually looks like on a freshly-imaged
# build VM (vs. this pre-existing reference one).
osot_template: "Omnissa\\Windows 10, 11 and Server 2022, 2025"

# osot_finalize_job_numbers / osot_finalize_cleanup_job_numbers: originally
# ONE variable ("0 1 2 3 4 5 6 7 10 11"), set 2026-09-11 per the user's
# explicit choice to run every Finalize job except 8 and 9. SPLIT INTO TWO
# 2026-09-16, per the user's explicit request to run OSOT Finalize as two
# separate passes at two different points in the pipeline - see
# roles/osot_finalize_cleanup's own header for the full rationale (job 7's
# SDelete64.exe can run long, so App Volumes now waits for it to genuinely
# finish before installing) and roles/osot_finalize's own header for why job
# 9 changed. Job 8 stays excluded from both, unchanged:
#   8 "Creates local group policies" (needs LGPO.exe) - not wanted, skipped
#     on purpose, not staged.
#
# FIRST pass (roles/osot_finalize_cleanup): the disk/profile/log
# housekeeping jobs. Originally ran BEFORE appvolumes so App Volumes
# wouldn't start until job 7 (SDelete64.exe) genuinely finished - MOVED
# 2026-09-17, per the user's explicit request, to run AFTER appvolumes
# instead (see roles/osot_finalize_cleanup's own header for the full
# before/after reasoning). Still runs before the second pass below.
osot_finalize_cleanup_job_numbers: "0 1 2 3 4 5 6 7"

# SECOND pass (roles/osot_finalize, right before hardening/cleanup/
# shutdown): the network/licensing-identity reset jobs. Runs after both
# appvolumes and osot_finalize_cleanup, unaffected by the 2026-09-17
# reorder above.
# Job 9 "Clears KMS Settings" is INCLUDED - FLAGGED, not a silent change:
# the original 2026-09-11 comment on this variable excluded job 9 because
# "this image uses win_kms_key's GVLK... clearing KMS settings here isn't
# something the user wants done at Finalize time" (still true - see
# variables.pkr.hcl). The user's 2026-09-16 request explicitly listed
# "9,10 and 11" for this pass, which reverses that - implemented as asked;
# see roles/osot_finalize's own header for the full flag/confirmation note.
#
# Job 11 "Release IP Address" - REMOVED 2026-09-16, same day it was added,
# after a real build (still running the pre-split single-pass version, but
# with the same "0 1 2 3 4 5 6 7 10 11" list) failed exactly where job 11
# would have run, with a WinRM ConnectTimeoutError to the guest ("Max
# retries exceeded... Connection to <ip> timed out (connect timeout=30)").
# Cross-checked against Omnissa's own docs.omnissa.com Finalize command-line
# reference: job 11 is literally "Releases IP Address" - no further detail
# on mechanism, but the failure signature (a fresh TCP connect timing out,
# not an existing connection resetting) matches the guest's IP actually
# changing/dropping mid-command. Confirmed with the user this is a real
# risk beyond just this one Ansible task: rdsh_2025_tpl.pkr.hcl's own
# communicator = "winrm" means Packer's shutdown_command rides the same
# channel, so losing the IP here could just as easily break Packer's own
# graceful shutdown afterward. User's explicit choice, given that risk:
# drop job 11 from the automated pipeline entirely rather than risk another
# failed build cycle chasing a Packer/WinRM interaction that isn't
# documented anywhere. If you want the "release IP before capture" hygiene
# back later, it needs its own dedicated, carefully-observed test run - not
# bundled in here.
osot_finalize_job_numbers: "9 10"

# osot_finalize_sdelete64_installer: CONFIRMED 2026-09-11 from the same NFS
# directory listing that confirmed osot_installer above - sdelete64.exe
# (NOT sdelete.exe, the 32-bit build sitting next to it in the same
# folder - job 7 needs the 64-bit one per the PDF) lives alongside the OSOT
# exe itself. Only used by roles/osot_finalize_cleanup now (job 7 moved
# there in the 2026-09-16 split above).
osot_finalize_sdelete64_installer: "/mnt/wdnfs/Ansible/osot/CHANGEME-sdelete64-installer.exe"   # <- placeholder - real value goes in rdsh_2025_tpl.local.yml
