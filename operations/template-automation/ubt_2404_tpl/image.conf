# images/ubt_2404_tpl/image.conf
# Per-image naming config, sourced by scripts/build.sh.
#
# Neither of these two values can be derived mechanically from the image
# directory name ("ubt_2404_tpl"), so they live here explicitly instead of
# being guessed by the dispatcher:
#
# VM_NAME - the reusable automation VM Packer builds onto every run. Fixed,
# not timestamped, so it keeps the same pinned MAC/IP/AD computer object/DNS
# record across runs (see scripts/build.sh's "VM naming" comment for why
# that matters). This is the exact value scripts/build.sh used to hardcode.
VM_NAME="ubt-2404-tpl"

# PUBLISHED_VM_PREFIX - scripts/build.sh appends "-<YYYYMMDD-HHMMSS>" to this
# to name the clone that actually gets snapshotted and pushed to the Horizon
# pool (PUBLISHED_VM_NAME). This is a short hand-picked abbreviation, not a
# transform of the directory name (e.g. not "ubt-2404-tpl" again) - this is
# the exact prefix scripts/build.sh used to hardcode as
# "gi-ubt2404-$(date +%Y%m%d-%H%M%S)".
PUBLISHED_VM_PREFIX="gi-ubt2404"