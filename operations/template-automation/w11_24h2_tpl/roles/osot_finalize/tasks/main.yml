---
# OSOT Finalize, second pass: osot_finalize_job_numbers (9 = clear KMS,
# 10 = flush DNS). Job 11 (release IP) is left out: it drops the WinRM
# connection Packer still needs for shutdown.
- name: Confirm no pending reboot before this phase
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/wait_for_no_pending_reboot.yml"
- name: Ensure OSOT is present on VM (idempotent copy)
  ansible.windows.win_copy:
    src: "{{ osot_installer }}"
    dest: "C:\\Temp\\{{ osot_installer | basename }}"

- name: Run OSOT Finalize pass (network/licensing jobs 9-10)
  ansible.windows.win_shell: |
    & "C:\Temp\{{ osot_installer | basename }}" -f {{ osot_finalize_job_numbers }}
    if ($LASTEXITCODE -ne 0) { throw "OSOT Finalize exited with code $LASTEXITCODE" }
  register: osot_finalize_result
  changed_when: true

- name: Show OSOT Finalize output
  ansible.builtin.debug:
    msg: "{{ osot_finalize_result.stdout_lines | default([]) }}"

- name: Copy OSOT's own Finalize (network/licensing pass) log into build_log_dir
  ansible.windows.win_shell: |
    $src = Get-ChildItem -Path "C:\ProgramData\Omnissa\Omnissa OS Optimization Tool\Log" -Filter "Finalize_*.log" -ErrorAction SilentlyContinue |
      Sort-Object LastWriteTime -Descending | Select-Object -First 1
    if ($src) {
      Copy-Item -Path $src.FullName -Destination "{{ build_log_dir }}\osot_finalize_report.log" -Force
      Write-Host "Copied $($src.FullName) to {{ build_log_dir }}\osot_finalize_report.log"
    } else {
      Write-Host "No Finalize_*.log found under OSOT's own log folder - filename pattern may differ, nothing to copy."
    }
  when: build_log_enabled | default(true) | bool
  ignore_errors: true

- name: Pause for log verification
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/pause_for_log_verification.yml"

- name: Log phase completion
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/log_phase_complete.yml"
