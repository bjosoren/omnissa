---
# Prep: C:\Temp, build log dir, and a fail-fast check that UEFI Secure Boot
# matches vm_secure_boot.
- name: Confirm no pending reboot before this phase
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/wait_for_no_pending_reboot.yml"
- name: Show target VM info
  ansible.builtin.debug:
    msg:
      - "Host: {{ ansible_hostname }}"
      - "OS  : {{ ansible_os_name | default('unknown') }}"

- name: Create C:\Temp for installer staging
  ansible.windows.win_file:
    path: C:\Temp
    state: directory

- name: Create build log directory
  ansible.windows.win_file:
    path: "{{ build_log_dir }}"
    state: directory
  when: build_log_enabled | bool

- name: Verify UEFI Secure Boot state matches vm_secure_boot
  ansible.windows.win_shell: |
    $sb = Confirm-SecureBootUEFI
    Write-Output $sb
    if ([bool]$sb -ne ${{ vm_secure_boot | default(true) | bool | string | lower }}) {
      throw "Secure Boot is '$sb' but vm_secure_boot is {{ vm_secure_boot | default(true) | bool }}"
    }
  register: secure_boot_state
  changed_when: false

- name: Show Secure Boot state
  ansible.builtin.debug:
    msg: "UEFI Secure Boot enabled: {{ secure_boot_state.stdout | trim }}"
