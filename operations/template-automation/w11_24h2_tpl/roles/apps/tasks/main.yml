---
# Optional extra apps from the NFS share: each apps_to_install entry is
# {name, installer, arguments}; installer is a path on the control node.
- name: Confirm no pending reboot before this phase
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/wait_for_no_pending_reboot.yml"
- name: Copy extra app installers to VM
  ansible.windows.win_copy:
    src: "{{ item.installer }}"
    dest: "C:\\Temp\\{{ item.installer | basename }}"
  loop: "{{ apps_to_install | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: apps_to_install is defined and apps_to_install | length > 0

- name: Install optional extra apps
  ansible.windows.win_package:
    path: "C:\\Temp\\{{ item.installer | basename }}"
    arguments: "{{ item.arguments | default('/qn REBOOT=ReallySuppress') }}"
    state: present
    expected_return_code: [0, 3010, 1641]
  loop: "{{ apps_to_install | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: apps_to_install is defined and apps_to_install | length > 0
  register: apps_install

- name: Reboot after extra app installs, if anything actually installed
  ansible.windows.win_reboot:
    reboot_timeout: 600
    post_reboot_delay: 30
    msg: "Rebooting after optional extra app installation"
  when: >-
    apps_install is defined and apps_install.results is defined
    and apps_install.results | selectattr('changed', 'true') | list | length > 0
