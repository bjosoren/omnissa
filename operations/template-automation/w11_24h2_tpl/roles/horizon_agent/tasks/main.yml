---
# Horizon Agent in VDI mode (no RDS role present); ADDLOCAL built from the
# horizon_* toggles in <image>_agents.yml.
- name: Confirm no pending reboot before this phase
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/wait_for_no_pending_reboot.yml"
- name: Build Horizon Agent ADDLOCAL feature list
  ansible.builtin.set_fact:
    horizon_addlocal: >-
      {{
        (['Core']
        + (['BlastUDP'] if horizon_blast else [])
        + (['USB'] if horizon_usb else [])
        + (['NGVC'] if horizon_ngvc else [])
        + (['RTAV'] if horizon_rtav else [])
        + (['ClientDriveRedirection'] if horizon_cdr else [])
        + (['SerialPortRedirection'] if horizon_serial_port else [])
        + (['ScannerRedirection'] if horizon_scanner else [])
        + (['GEOREDIR'] if horizon_geolocation else [])
        + (['SmartCard'] if horizon_smartcard else [])
        + (['HznVaudio'] if horizon_audio else [])
        + (['TSMMR'] if horizon_mmr else [])
        + (['RDP'] if horizon_rdp else [])
        + (['SdoSensor'] if horizon_sdo_sensor else [])
        + (['PerfTracker'] if horizon_perf_tracker else [])
        + (['HelpDesk'] if horizon_help_desk else [])
        + (['PrintRedir'] if horizon_print_redir else [])
        + (['PSG'] if horizon_psg else [])
        + (['URLRedirection'] if horizon_url_filtering else [])
        ) | join(',')
      }}

- name: Show ADDLOCAL string
  ansible.builtin.debug:
    msg: "ADDLOCAL={{ horizon_addlocal }}"

- name: Copy Horizon Agent installer to VM
  ansible.windows.win_copy:
    src: "{{ horizon_agent_installer }}"
    dest: "C:\\Temp\\{{ horizon_agent_installer | basename }}"

- name: Install Horizon Agent (VDI mode)
  ansible.windows.win_package:
    path: "C:\\Temp\\{{ horizon_agent_installer | basename }}"
    arguments: >-
      /s /v "/qn
      VDM_VC_MANAGED_AGENT={{ horizon_vc_managed | int }}
      SUPPRESS_RUNONCE_CHECK=1
      ADDLOCAL={{ horizon_addlocal }}
      REBOOT=ReallySuppress
      {% if build_log_enabled | bool %}/log {{ build_log_dir }}\horizon_agent_install.log{% endif %}"
    state: present
    expected_return_code: [0, 3010, 1641]
  register: horizon_install

- name: Reboot after Horizon Agent install
  ansible.windows.win_reboot:
    reboot_timeout: 300
    post_reboot_delay: 60
    msg: "Rebooting after Horizon Agent installation"

- name: Verify Horizon Agent installed
  ansible.windows.win_shell: |
    $agent = Get-ItemProperty "HKLM:\SOFTWARE\Omnissa\Horizon\Agent" -ErrorAction SilentlyContinue | Select-Object -First 1
    if ($agent) {
      Write-Output "Horizon Agent installed: $($agent.ProductVersion)"
    } else {
      throw "Horizon Agent not found in registry"
    }
  register: horizon_verify
  changed_when: false

- name: Show installation result
  ansible.builtin.debug:
    msg: "{{ horizon_verify.stdout }}"

- name: Horizon Agent VDI installation complete
  ansible.builtin.debug:
    msg:
      - "Mode    : VDI (VDM_VC_MANAGED_AGENT={{ horizon_vc_managed | int }})"
      - "ADDLOCAL: {{ horizon_addlocal }}"
