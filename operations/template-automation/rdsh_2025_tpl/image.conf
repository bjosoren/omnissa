# images/rdsh_2025_tpl/image.conf
# Per-image naming config, sourced by scripts/build.sh - same mechanism as
# images/ubt_2404_tpl/image.conf, see that file's comments for why these two
# values live here explicitly instead of being derived from the image key.
#
# VM_NAME - the reusable automation VM Packer builds onto every run.
VM_NAME="rdsh-2025-tpl"

# PUBLISHED_VM_PREFIX - scripts/build.sh appends "-<YYYYMMDD-HHMMSS>" to
# this to name the clone that actually gets snapshotted and pushed to the
# Horizon farm/pool (PUBLISHED_VM_NAME).
PUBLISHED_VM_PREFIX="gi-rdsh2025"
