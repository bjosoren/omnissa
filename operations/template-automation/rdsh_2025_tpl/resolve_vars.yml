---
# resolve_vars.yml
# Same purpose and mechanism as images/ubt_2404_tpl/resolve_vars.yml - see
# that file's header comment for the full explanation of why this exists
# (letting Ansible resolve group_vars + vault Jinja instead of reimplementing
# that in scripts/build.sh) and why connection: local matters here (the VM
# named in hosts.ini for this group may not exist yet on a first run).
- name: Resolve platform + image vars for scripts/build.sh
  hosts: rdsh_2025_tpl
  connection: local
  gather_facts: false
  tasks:
    # mac_address defaults to '' (auto-assigned), matching
    # ubt_2404_tpl/variables.pkr.hcl's own mac_address default. guest_ip_cidr/
    # guest_gateway/guest_dns_servers also default out (to '' / []) - this
    # image is built DHCP-only (see variables.pkr.hcl's comment on those
    # three: nothing in the build actually applies a static IP), so they're
    # optional rather than required. Every other key below is still required
    # in group_vars/all.yml or this image's own group_vars/rdsh_2025_tpl.yml;
    # a missing one fails here with "'<name>' is undefined" naming exactly
    # which one to add.
    #
    # horizon_farm_name (added 2026-09-10, alongside the existing
    # horizon_pool_name) - this image publishes to an RDS Farm, not a
    # desktop pool, but this file was originally copied from
    # ubt_2404_tpl/resolve_vars.yml and only carried horizon_pool_name
    # forward. Missing here meant scripts/publish_to_pool.sh's .packer_vars.json
    # never had a horizon_farm_name key at all, so even after that script
    # was fixed to look for it, it would always read as empty - see that
    # script's own "Pool vs farm" header comment for the fix on its side.
    # default('') matches horizon_pool_name's own treatment here (and
    # ubt_2404_tpl's resolve_vars.yml, which has no horizon_farm_name key
    # and doesn't need one).
    - name: Write resolved vars to a local, root-only JSON file
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/.packer_vars.json"
        mode: "0600"
        content: >-
          {{ {
            'vcenter_server': vcenter_server,
            'vcenter_username': vcenter_username,
            'vcenter_password': vcenter_password,
            'vcenter_datacenter': vcenter_datacenter,
            'vcenter_cluster': vcenter_cluster,
            'vcenter_datastore': vcenter_datastore,
            'vcenter_folder': vcenter_folder,
            'vcenter_network': vcenter_network,
            'vm_cpu_count': vm_cpu_count,
            'vm_cores_per_socket': vm_cores_per_socket,
            'vm_mem_size_mb': vm_mem_size_mb,
            'vm_disk_size_mb': vm_disk_size_mb,
            'vm_guest_os_type': vm_guest_os_type,
            'vm_version': vm_version,
            'iso_paths': iso_paths,
            'guest_hostname': guest_hostname,
            'guest_ip_cidr': guest_ip_cidr | default(''),
            'guest_gateway': guest_gateway | default(''),
            'guest_dns_servers': guest_dns_servers | default([]),
            'mac_address': mac_address | default(''),
            'domain_fqdn': domain_fqdn,
            'timezone': timezone,
            'win_language': win_language,
            'win_keyboard': win_keyboard,
            'win_image_name': win_image_name,
            'win_kms_key': win_kms_key,
            'win_full_name': win_full_name,
            'win_org_name': win_org_name,
            'winrm_port': winrm_port,
            'horizon_agent_installer': horizon_agent_installer,
            'dem_agent_installer': dem_agent_installer,
            'appvolumes_agent_installer': appvolumes_agent_installer,
            'appvolumes_manager': appvolumes_manager,
            'vault_win_admin_password': vault_win_admin_password,
            'horizon_connection_server': horizon_connection_server | default(''),
            'horizon_pool_name': horizon_pool_name | default(''),
            'horizon_farm_name': horizon_farm_name | default(''),
            'horizon_api_username': horizon_api_username | default(''),
            'horizon_api_domain': horizon_api_domain | default(''),
            'vault_horizon_api_password': vault_horizon_api_password | default(''),
          } | to_nice_json }}
