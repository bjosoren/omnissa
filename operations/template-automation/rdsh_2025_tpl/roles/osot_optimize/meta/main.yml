---
# Ansible's play-level `roles:` keyword silently DE-DUPLICATES a role
# invoked more than once with identical parameters within the same play,
# unless this flag is set - without it, the second `- role: osot_optimize`
# entry in playbook.yml would show up in the play recap but Ansible would
# actually skip running it a second time, with no warning or error. See
# https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_reuse_roles.html
# ("Role de-duplication based on tags"/execution section) for the documented
# behavior this works around.
allow_duplicates: true
