# roles/windows_update/tasks/main.yml
- name: Confirm no pending reboot before this phase
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/wait_for_no_pending_reboot.yml"
# A full, looped Windows Update pass - search, install, reboot if needed,
# repeat - run between hypervisor tools and everything that follows
# (agents, roles, features). Required, not optional: a freshly installed,
# not-yet-serviced component store can cause Windows Feature installs
# (e.g. RDS-RD-Server) to fail with DISM error 0x800f0922 if this hasn't
# run first, since DISM falls back to Windows Update for missing feature
# payloads.
#
# Bounded at 6 rounds rather than looping forever - a fresh install can
# genuinely need several passes (servicing stack, cumulative update, .NET
# rollup, etc., each only revealing the next on the restart after it),
# but still needs a ceiling. round.yml sets windows_update_clear so this
# loop stops early once a round finds nothing left to do and nothing
# pending.
#
# This task's own name deliberately does NOT include {{ item }} - Ansible
# renders an include_tasks loop's display name once before the loop's
# first iteration binds item, which produces a harmless but noisy
# "'item' is undefined" warning otherwise. round.yml's own per-round
# tasks carry "({{ item }})" in their names instead.

- name: Windows Update source for this build
  ansible.builtin.set_fact:
    _wu_wsus: "{{ (windows_update_source | default('windows_update')) == 'wsus' }}"
    windows_update_server_selection: >-
      {{ 'managed_server' if (windows_update_source | default('windows_update')) == 'wsus'
         else 'windows_update' }}

- name: Fail if WSUS was chosen without a server URL
  ansible.builtin.assert:
    that: wsus_server_url | default('') | length > 0
    fail_msg: "windows_update_source is wsus but wsus_server_url is empty"
  when: _wu_wsus | bool

- name: Point Windows Update at WSUS (WUServer / WUStatusServer)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
    name: "{{ wu_value }}"
    data: "{{ wsus_server_url }}"
    type: string
  loop: [WUServer, WUStatusServer]
  loop_control:
    loop_var: wu_value
  when: _wu_wsus | bool

- name: Point Windows Update at WSUS (UseWUServer = 1)
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
    name: UseWUServer
    data: 1
    type: dword
  when: _wu_wsus | bool

- name: Restart Windows Update to pick up the WSUS setting
  ansible.windows.win_service:
    name: wuauserv
    state: restarted
  when: _wu_wsus | bool

- name: Show Windows Update source
  ansible.builtin.debug:
    msg: >-
      Updating from {{ ('WSUS ' ~ wsus_server_url) if (_wu_wsus | bool) else 'Windows Update (Microsoft)' }}
      (server_selection {{ windows_update_server_selection }})

- name: "Windows Update round"
  ansible.builtin.include_tasks: round.yml
  loop: "{{ range(1, 7) | list }}"
  loop_control:
    loop_var: item
    label: "{{ item }}/6"
  when: windows_update_clear is not defined or not windows_update_clear

- name: Fail if Windows Update still isn't clear after 6 rounds
  ansible.builtin.fail:
    msg: >-
      Windows Update still has updates pending and/or a reboot pending
      after 6 rounds - something is genuinely stuck rather than just
      multi-wave updates settling (check VLAN 12 internet/WSUS reachability
      from this VM specifically, and Windows Update's own error history via
      Get-WindowsUpdateLog or Settings > Windows Update > Update history).
      Console/WinRM into the VM and check manually before re-running.
  when: windows_update_clear is not defined or not windows_update_clear

- name: Remove the build-time WSUS setting from the image (clones get theirs from GPO)
  ansible.windows.win_regedit:
    path: "{{ wu_reg.path }}"
    name: "{{ wu_reg.name }}"
    state: absent
  loop:
    - { path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate', name: WUServer }
    - { path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate', name: WUStatusServer }
    - { path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU', name: UseWUServer }
  loop_control:
    loop_var: wu_reg
  when: (_wu_wsus | bool) and not (wsus_keep_policy | default(false) | bool)

- name: Restart Windows Update after removing the WSUS setting
  ansible.windows.win_service:
    name: wuauserv
    state: restarted
  when: (_wu_wsus | bool) and not (wsus_keep_policy | default(false) | bool)

- name: Show Windows Update settle result
  ansible.builtin.debug:
    msg: "Windows Update is fully settled - no updates pending, no reboot pending."

# round.yml appends one entry to windows_update_report.log under
# build_log_dir for each round that actually installed something (rounds
# that find/install nothing are skipped - see that file's own header),
# so a build's installed-update history is auditable after the fact
# without needing the live console output. Picked up automatically by
# collect_build_logs' zip, same as every other role's report log.
- name: Log phase completion
  ansible.builtin.import_tasks: "{{ role_path }}/../common/tasks/log_phase_complete.yml"