# roles/windows_update/tasks/round.yml
# One round of "search for updates, install what's found, reboot if
# needed" - included in a bounded loop by main.yml. Sets
# windows_update_clear so main.yml's loop can stop early once a round
# finds nothing left to do.
#
# become: runas/SYSTEM matches win_updates' own documented fallback for
# when its default Task Scheduler background-process mechanism isn't
# available - SYSTEM needs no password to become via the runas plugin.
#
# category_names deliberately matches win_updates' own documented default
# (CriticalUpdates/SecurityUpdates/UpdateRollups) rather than a broader
# list that also includes DefinitionUpdates: Windows Defender antivirus
# *definition* updates (e.g. KB2267602) are republished multiple times a
# day, so including that category can make this loop see "new updates"
# every round and never settle. reject_list below is belt-and-suspenders
# in case a definition update ever surfaces under one of the three
# categories still in use.
#
# reboot: true (rather than a separate win_reboot task after this one) -
# win_updates reboots and resumes internally as one coordinated
# operation. A separate win_reboot task risks a race where WinRM
# reconnects while CBS/TrustedInstaller is still finalizing a large
# update in the background, so the next round's search can still see it
# as not-yet-committed and re-offer it.
- name: "Search for, install, and reboot for Windows updates ({{ item }})"
  ansible.windows.win_updates:
    category_names:
      - SecurityUpdates
      - CriticalUpdates
      - UpdateRollups
    reject_list:
      - "KB2267602"
    state: installed
    reboot: true
    reboot_timeout: 1800
  register: wu_round
  become: true
  become_method: runas
  become_user: SYSTEM

- name: "Show this round's result ({{ item }})"
  ansible.builtin.debug:
    msg: >-
      Round {{ item }}: found={{ wu_round.found_update_count }}
      installed={{ wu_round.installed_update_count }}
      reboot_required={{ wu_round.reboot_required }}
      titles={{ (wu_round.updates | default({})).values()
                 | map(attribute='title') | list }}

# Appends an audit entry (KB numbers, titles, installed status) to
# windows_update_report.log under build_log_dir, so a build's actual
# installed-update history survives after the build finishes. Only runs
# when this round actually installed something - a round that found
# nothing is noise, not audit info.
#
# wu_round.updates' free-text titles go through a to_json / ConvertFrom-Json
# round-trip rather than straight Jinja string interpolation into the
# PowerShell here-string, since a title containing a quote or backtick
# could otherwise break the embedded script. Everything else interpolated
# directly (round number, counts, booleans) has nothing to escape.
#
# ignore_errors: true - a logging hiccup here should never fail an
# otherwise-good Windows Update round.
- name: "Append this round's installed updates to windows_update_report.log ({{ item }})"
  ansible.windows.win_shell: |
    $updatesJson = @'
    {{ ((wu_round.updates | default({})).values() | list) | to_json }}
    '@
    $updates = $updatesJson | ConvertFrom-Json
    $stamp = Get-Date -Format 'yyyy-MM-dd HH:mm:ss'
    $lines = @()
    $lines += "=== Round {{ item }}/6 - $stamp ==="
    $lines += "Found: {{ wu_round.found_update_count | default(0) }}  Installed: {{ wu_round.installed_update_count | default(0) }}  RebootRequired: {{ wu_round.reboot_required | default(false) }}"
    foreach ($u in $updates) {
      $kb = if ($u.kb) { ($u.kb -join ',') } else { 'n/a' }
      $state = if ($u.installed) { 'installed' } else { 'not installed' }
      $lines += "  - KB$($kb): $($u.title) ($state)"
    }
    $lines += ""
    Add-Content -Path "{{ build_log_dir }}\windows_update_report.log" -Value $lines
  when:
    - build_log_enabled | default(true) | bool
    - (wu_round.installed_update_count | default(0) | int) > 0
  ignore_errors: true

- name: "Mark this round clear if nothing was found/installed and nothing is pending ({{ item }})"
  ansible.builtin.set_fact:
    windows_update_clear: >-
      {{ (wu_round.found_update_count | default(0) == 0)
         and not (wu_round.reboot_required | default(false)) }}